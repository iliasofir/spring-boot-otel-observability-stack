global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OpenTelemetry agent metrics (already exists)
  - job_name: 'otel-agent'
    static_configs:
      - targets: ['app:9464']
    metrics_path: '/metrics'

  # ADD THIS - Spring Boot actuator metrics
  - job_name: 'spring-boot-app'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s