# Application Configuration
spring.application.name=spring-otel-observability-lab
server.port=8080

# Prometheus Metrics - Actuator endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus
management.prometheus.metrics.export.enabled=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId},spanId=%X{spanId}] %-5level %logger{36} - %msg%n


# Enable histogram buckets for latency percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Disable strict SLO validation temporarily
management.metrics.distribution.slo.http.server.requests=
management.metrics.distribution.slo.payment.processing.duration=


